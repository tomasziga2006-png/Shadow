
<!doctype html>
<html lang="en">
  <head>

    />

    <meta name="theme-color" content="#0e0e0e" />

    <!-- Browser Icon -->
    <link
      rel="icon"
      type="image/webp"
      href="https://cdn.tip4serv.com/shop/ALL_STORES/15823/templates/neon/assets/images/9d91820cbe0d8c29f9068da91cfde636.webp"
    />

    <!-- Discord & Social Media Preview -->
    <meta

    <meta property="og:type" content="website" />

    <!-- Twitter / X Preview -->

    <meta
      name="twitter:title"

    />

    <meta

    <meta
      name="twitter:image"

    />

    <!-- Preserve Dark Mode -->
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
